services:
  postgres:
    image: postgres:18-alpine
    container_name: agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_backend_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-agent_backend_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agent_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agent_backend_db}?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KANBANIZE_API_KEY: ${KANBANIZE_API_KEY:-}
      KANBANIZE_SUBDOMAIN: ${KANBANIZE_SUBDOMAIN:-}
      AZURE_DEVOPS_ORG_URL: ${AZURE_DEVOPS_ORG_URL:-}
      AZURE_DEVOPS_PROJECT: ${AZURE_DEVOPS_PROJECT:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
      REPOS_BASE_DIR: /workspace/repos
    volumes:
      # Montagem dos repositórios locais do host
      - ${HOST_REPOS_PATH:-../}:/workspace/repos
      # Configuração git do host se existir
      - ~/.gitconfig:/root/.gitconfig:ro
    networks:
      - agent-network

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agent_frontend_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3333
      VITE_WS_URL: ws://localhost:3333
    networks:
      - agent-network

volumes:
  postgres_data:
    driver: local

networks:
  agent-network:
    driver: bridge
