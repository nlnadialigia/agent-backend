name: Auto Create PR & Link Issue

on:
  push:
    branches:
      - 'feat/issue_*'
      - 'feat/issue-*'

jobs:
  auto-create-pr:
    name: Auto Create Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request with Auto-Close Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Processando branch enviada: $BRANCH_NAME"

          # 1. Extrair número da issue (ex.: feat/issue_06 -> 6, feat/issue-12 -> 12)
          RAW_NUM=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+' | head -n 1)

          if [ -n "$RAW_NUM" ]; then
            # Remover zeros à esquerda (06 vira 6)
            ISSUE_NUM=$((10#$RAW_NUM))
            echo "Número da issue identificado: #$ISSUE_NUM"

            # Tenta buscar o título original da issue no GitHub via CLI
            ISSUE_TITLE=$(gh issue view "$ISSUE_NUM" --json title -q .title 2>/dev/null || echo "")

            if [ -n "$ISSUE_TITLE" ]; then
              PR_TITLE="feat: $ISSUE_TITLE (Issue #$ISSUE_NUM)"
            else
              PR_TITLE="feat: implementação da branch $BRANCH_NAME"
            fi

            PR_BODY="## 🤖 Pull Request Criado Automaticamente

Este Pull Request foi aberto automaticamente a partir do push na branch \`$BRANCH_NAME\`.

### 📌 Issue Vinculada:
Closes #$ISSUE_NUM

---
> *Quando este PR for aprovado e integrado à \`main\`, a issue #$ISSUE_NUM será encerrada automaticamente pelo GitHub.*"
          else
            PR_TITLE="feat: implementação da branch $BRANCH_NAME"
            PR_BODY="Pull Request aberto automaticamente a partir da branch \`$BRANCH_NAME\`."
          fi

          # 2. Verificar se já existe um PR aberto para esta mesma branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number -q '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Já existe um Pull Request aberto (#$EXISTING_PR) para esta branch. Nenhuma ação necessária."
          else
            echo "Criando novo Pull Request..."
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
